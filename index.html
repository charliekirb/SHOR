<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Happy Birthday, Bae 🎀</title>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Quicksand:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg1:#ffe4ee;--bg2:#e6e0ff;--card:#fffaf5;--ink:#5b4a63;--ac:#ff8fb1;--ac2:#b9a6ff;--g1:#cfe8ff;--g2:#ffe4ee;--h1:#c4efd0;--h2:#a6e0b6;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#2a1f35;--bg2:#1f2038;--card:#3a2f47;--ink:#f6e8f0;--ac:#ff9cbc;--g1:#2b2a52;--g2:#4a2f55;--h1:#3b6a58;--h2:#2f5a4a;color-scheme:dark}}
:root[data-theme="dark"]{--bg1:#2a1f35;--bg2:#1f2038;--card:#3a2f47;--ink:#f6e8f0;--ac:#ff9cbc;--g1:#2b2a52;--g2:#4a2f55;--h1:#3b6a58;--h2:#2f5a4a;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;background:linear-gradient(160deg,var(--bg1),var(--bg2));color:var(--ink);font-family:Quicksand,system-ui,sans-serif;padding:20px;overflow-x:hidden}
.fx{position:fixed;pointer-events:none;z-index:50;animation:rise linear forwards}
@keyframes rise{to{transform:translateY(-110vh) rotate(25deg);opacity:0}}
.spark{position:fixed;pointer-events:none;z-index:60;font-size:18px;animation:sp .8s forwards}
@keyframes sp{to{transform:translateY(-30px) scale(1.6);opacity:0}}
.wrap{max-width:480px;margin:0 auto;text-align:center}
.scene{display:none;animation:in .6s ease}
.scene.on{display:block}
@keyframes in{from{opacity:0;transform:translateY(20px)}}
h1{font-family:Caveat,cursive;font-size:clamp(46px,13vw,68px);margin:40px 0 0;color:var(--ac);line-height:1}
.nm{font-family:Caveat,cursive;font-size:32px;color:var(--ac2);margin:4px 0 18px}
.btn{border:0;border-radius:999px;padding:13px 26px;font:600 16px Quicksand,sans-serif;background:var(--ac);color:#fff;cursor:pointer;box-shadow:0 6px 16px rgba(255,143,177,.4);margin-top:14px}
.cd{display:inline-block;margin:0 0 16px;padding:8px 18px;border-radius:999px;background:var(--card);font-weight:600;box-shadow:0 4px 14px rgba(120,90,140,.15)}
.mus{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);right:12px;z-index:80;width:44px;height:44px;border-radius:50%;border:0;background:var(--card);font-size:20px;cursor:pointer;box-shadow:0 4px 14px rgba(120,90,140,.25)}
.btn.alt{background:transparent;color:var(--ac);border:2px dashed var(--ac);box-shadow:none}
.big{font-size:90px;margin-top:30px;animation:bob 2.5s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-10px)}}
.bar{display:flex;justify-content:space-between;align-items:center;margin:6px 4px 12px;font-weight:600}
.garden{position:relative;height:430px;border-radius:26px;overflow:hidden;background:linear-gradient(var(--g1),var(--g2) 70%);box-shadow:0 10px 26px rgba(120,90,140,.2)}
.hill{position:absolute;border-radius:50%}
.item{position:absolute;font-size:46px;background:none;border:0;cursor:pointer;animation:bob 3s ease-in-out infinite;padding:4px;z-index:2}
.item{filter:drop-shadow(0 2px 4px rgba(120,90,140,.35))}
.item.found{opacity:.4;animation:none}
.modal{position:fixed;inset:0;background:rgba(60,40,80,.45);display:none;align-items:center;justify-content:center;padding:24px;z-index:70}
.modal.on{display:flex}
.card{background:var(--card);border-radius:20px;padding:26px 22px;max-width:380px;text-align:center;animation:in .4s}
.card .e{font-size:54px}
.card p{line-height:1.7;margin:8px 0 0}
.letter{background:var(--card);border-radius:18px;padding:28px 24px;text-align:left;box-shadow:0 12px 30px rgba(120,90,140,.2);margin-top:20px}
.letter h2{font-family:Caveat,cursive;font-size:36px;margin:0 0 10px;color:var(--ac)}
.letter p{line-height:1.7;margin:0 0 12px;white-space:pre-line}
.sign{font-family:Caveat,cursive;font-size:32px;text-align:right;color:var(--ac2)}
svg{width:100%;max-width:320px;overflow:visible}
.stem{stroke-dasharray:1;stroke-dashoffset:1;animation:draw .6s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.bloom{transform-box:fill-box;transform-origin:center;animation:bl .9s cubic-bezier(.2,1.5,.4,1) .35s backwards}
@keyframes bl{from{transform:scale(0) rotate(-40deg)}}
.pop{display:none;margin-top:16px;padding:20px 16px;border-radius:18px;background:linear-gradient(160deg,var(--g1),var(--g2));animation:in .6s}
.pop.on{display:block}
.pop .m{font-size:64px;display:inline-block;animation:fl .7s ease-in-out infinite alternate}
.pop img{width:100%;max-width:320px;height:auto;border-radius:18px;border:5px solid var(--ac);animation:fl2 .9s ease-in-out infinite alternate}
@keyframes fl2{from{transform:rotate(-2deg)}to{transform:rotate(2deg) scale(1.03)}}
@keyframes fl{from{transform:scale(1) rotate(-6deg)}to{transform:scale(1.12) rotate(6deg)}}
.pop p{line-height:1.6;margin:10px 0 0}
</style>
</head>
<body>
<div class="wrap">
  <section class="scene on" id="s1">
    <div class="big">🎀</div>
    <h1>Happy Birthday, <span id="c1"></span>!</h1>
    <div class="nm" id="nm"></div>
    <p>I made something small for your birthday.<br>I hope you like it. 🌷</p>
    <button class="btn" id="go">Enter ✨</button>
  </section>

  <section class="scene" id="s2">
    <div class="bar"><span>Find the hidden surprises</span><span id="prog">💗 0/5</span></div>
    <div class="garden" id="garden">
      <div class="hill" style="left:-20%;bottom:-70px;width:80%;height:170px;background:var(--h1)"></div>
      <div class="hill" style="right:-25%;bottom:-90px;width:90%;height:190px;background:var(--h2)"></div>
    </div>
    <p id="hint">Tap the little things floating around 👆</p>
    <button class="btn" id="env" style="display:none">💌 Open your letter</button>
  </section>

  <section class="scene" id="s3">
    <div class="letter">
      <h2 id="dear"></h2>
      <p id="msg"></p>
      <div class="sign" id="from"></div>
    </div>
    <button class="btn" id="tob">One more thing 🌷</button>
  </section>

  <section class="scene" id="s4">
    <h1 style="margin-top:10px;font-size:46px">Grow your bouquet</h1>
    <svg viewBox="0 0 320 380" aria-label="A bouquet of pastel flowers">
      <g id="stems" fill="none" stroke="#7fc79a" stroke-width="3" stroke-linecap="round">
        <g fill="#8fd4a8" stroke="none"><ellipse cx="115" cy="238" rx="8" ry="18" transform="rotate(-40 115 238)"/><ellipse cx="205" cy="238" rx="8" ry="18" transform="rotate(40 205 238)"/><ellipse cx="140" cy="215" rx="6" ry="14" transform="rotate(-15 140 215)"/><ellipse cx="180" cy="215" rx="6" ry="14" transform="rotate(15 180 215)"/></g>
      </g>
      <g id="flws"></g>
      <polygon points="70,255 250,255 182,360 138,360" style="fill:var(--ac2)" opacity=".92"/>
      <polygon points="70,255 160,255 138,360" fill="#fff" opacity=".2"/>
      <g style="fill:var(--ac)"><ellipse cx="136" cy="292" rx="22" ry="12" transform="rotate(-20 136 292)"/><ellipse cx="184" cy="292" rx="22" ry="12" transform="rotate(20 184 292)"/><circle cx="160" cy="297" r="9"/></g>
    </svg>
    <p id="cap" style="font-family:Caveat,cursive;font-size:30px;color:var(--ac);margin:0"></p>
    <button class="btn" id="add">Plant a flower 🌷 (0/9)</button>
    <button class="btn alt" id="sec" style="display:none">Click to see what you love most 💪</button>
    <div class="pop" id="pop"></div>
  </section>
</div>
<button class="mus" id="mus" style="display:none" aria-label="Turn music on or off">🎵</button>
<div class="modal" id="modal"><div class="card"><div class="e" id="me"></div><p id="mt"></p><button class="btn" id="mc">Aww 💗</button></div></div>

<script>
var NAME = "Novreyn Ira", CALL = "Bae", FROM = "Kirby";
var BICEP_PHOTO = "bicep.jpg"; 
var MESSAGE = "Happy birthday, Bae! I’m really glad I met you. Thank you for being part of my life and making my days better. I’m happy that I got to know you, and I hope we get to know each other even more.\n\nI hope you enjoy your special day and get everything you wish for. Always take care of yourself, keep chasing your dreams, and don’t forget to be happy.\n\nI’m really happy to have you, Bae, and I hope I can keep making you smile. You deserve to be loved, appreciated, and treated right, not just on your birthday but every day.\n\nEnjoy your day, my Baby. I hope I can be one of the reasons you smile today. I’m always rooting for you, and I hope life brings you so many good things. Happy birthday again, pretty girl. I love you more than you know. ❤️";
var ITEMS = [
 {e:"🌷",h:"A Little Reminder",x:10,y:14,t:"You’re special to me, Bae. Never forget that."},
 {e:"🤍",h:"What I Like About You",x:66,y:58,t:"You make my days better just by being you."},
 {e:"✨",h:"A Little Wish",x:24,y:62,t:"I hope you get everything your heart wishes for."},
 {e:"💌",h:"Just for You",x:60,y:12,t:"I’m really glad I got the chance to know you."},
 {e:"❤️",h:"My Favorite Person",x:82,y:34,t:"No matter what, I’m happy it’s you, Bae. Happy birthday!"}
];
var $ = function(i){ return document.getElementById(i); };
var found = 0;

$("c1").textContent = CALL; $("nm").textContent = NAME;
$("dear").textContent = "Dear " + CALL + ","; $("msg").textContent = MESSAGE;
$("from").textContent = "With love, " + FROM;

function show(id){
  var s = document.querySelectorAll(".scene");
  for (var i = 0; i < s.length; i++) s[i].classList.remove("on");
  $(id).classList.add("on"); window.scrollTo(0, 0);
}
function hearts(n){
  var e = ["💗","💖","🌸","✨","💕","🎀","🦋"];
  for (var i = 0; i < n; i++) (function(i){ setTimeout(function(){
    var h = document.createElement("div"); h.className = "fx"; h.style.bottom = "-30px";
    h.textContent = e[Math.floor(Math.random()*e.length)];
    h.style.left = Math.random()*100 + "vw"; h.style.fontSize = (16 + Math.random()*20) + "px";
    h.style.animationDuration = (5 + Math.random()*5) + "s"; document.body.appendChild(h);
    setTimeout(function(){ h.remove(); }, 10000);
  }, i*200); })(i);
}
document.addEventListener("pointerdown", function(ev){
  var s = document.createElement("div"); s.className = "spark"; s.textContent = "✨";
  s.style.left = ev.clientX - 9 + "px"; s.style.top = ev.clientY - 9 + "px";
  document.body.appendChild(s); setTimeout(function(){ s.remove(); }, 800);
});

ITEMS.forEach(function(it, i){
  var b = document.createElement("button"); b.className = "item"; b.textContent = it.e;
  b.style.left = it.x + "%"; b.style.top = it.y + "%"; b.style.animationDelay = (i*0.4) + "s";
  b.setAttribute("aria-label", "Surprise " + (i+1));
  b.addEventListener("click", function(){
    $("me").textContent = it.e; $("mt").innerHTML = '<b style="font-family:Caveat,cursive;font-size:28px;color:var(--ac)">' + it.h + '</b><br>' + it.t; $("modal").classList.add("on");
    if (!b.classList.contains("found")){
      b.classList.add("found"); found++; $("prog").textContent = "💗 " + found + "/5"; hearts(6);
      if (found === 5){ $("hint").textContent = "You found them all, " + CALL + "! 🎉"; $("env").style.display = "inline-block"; }
    }
  });
  $("garden").appendChild(b);
});

var MEL = [[392,.75],[392,.25],[440,1],[392,1],[523.25,1],[493.88,2],[392,.75],[392,.25],[440,1],[392,1],[587.33,1],[523.25,2],[392,.75],[392,.25],[783.99,1],[659.25,1],[523.25,1],[493.88,1],[440,2],[698.46,.75],[698.46,.25],[659.25,1],[523.25,1],[587.33,1],[523.25,2]];
var ac, master, timer, musicOn = false;
function note(f, t, d){
  var g = ac.createGain(), g2 = ac.createGain(), o = ac.createOscillator(), o2 = ac.createOscillator();
  o.type = "sine"; o2.type = "triangle"; o.frequency.value = f; o2.frequency.value = f * 2; g2.gain.value = .3;
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(.16, t + .01); g.gain.exponentialRampToValueAtTime(.0001, t + d + .9);
  o.connect(g); o2.connect(g2); g2.connect(g); g.connect(master);
  o.start(t); o2.start(t); o.stop(t + d + 1); o2.stop(t + d + 1);
}
function loop(){
  if (!musicOn) return;
  var t = ac.currentTime + .05, B = .55;
  MEL.forEach(function(n){ note(n[0], t, n[1]*B); t += n[1]*B; });
  timer = setTimeout(loop, (t - ac.currentTime + 1.5) * 1000);
}
function setMusic(v){
  musicOn = v; $("mus").textContent = v ? "🎵" : "🔇"; clearTimeout(timer);
  if (v){
    if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)();
    if (ac.state === "suspended") ac.resume();
    master = ac.createGain(); master.connect(ac.destination); loop();
  } else if (master){ master.disconnect(); }
}
$("mus").addEventListener("click", function(){ setMusic(!musicOn); });
$("go").addEventListener("click", function(){ show("s2"); hearts(10); $("mus").style.display = "block"; setMusic(true); });
$("mc").addEventListener("click", function(){ $("modal").classList.remove("on"); });
$("env").addEventListener("click", function(){ show("s3"); hearts(20); });
$("tob").addEventListener("click", function(){ show("s4"); });

function flower(t, c){
  if (t === "daisy"){
    var p = ""; for (var i = 0; i < 8; i++) p += '<ellipse cy="-14" rx="6" ry="13" transform="rotate(' + i*45 + ')"/>';
    return '<g fill="' + c + '" stroke="rgba(0,0,0,.12)">' + p + '</g><circle r="7" fill="#ffd86b"/>';
  }
  if (t === "tulip"){
    return '<path d="M-15 8C-18-14-8-26 0-32C8-26 18-14 15 8C6 14-6 14-15 8Z" fill="' + c + '" stroke="rgba(0,0,0,.12)"/><path d="M0-32C-7-16-5 0 0 10C5 0 7-16 0-32Z" fill="#fff" opacity=".35"/>';
  }
  return '<circle r="17" fill="' + c + '" stroke="rgba(0,0,0,.15)"/><circle r="12" fill="none" stroke="rgba(0,0,0,.18)" stroke-width="2"/><circle r="7" fill="none" stroke="rgba(0,0,0,.2)" stroke-width="2"/><path d="M-5 0a5 5 0 1 1 5 5" fill="none" stroke="rgba(0,0,0,.25)" stroke-width="2"/>';
}
var SLOTS = [[160,78,"daisy","#fff7f2",1.7],[105,110,"rose","#ff8fb1",1.35],[215,110,"tulip","#c9b8ff",1.25],[70,165,"daisy","#ffd3a8",1.3],[250,165,"daisy","#fff7f2",1.3],[135,150,"daisy","#ffc2d6",1.5],[190,150,"rose","#ffb3cf",1.25],[105,205,"tulip","#ff8fb1",1.1],[215,205,"daisy","#fff7f2",1.2]];
var SPR = [[48,120],[272,120],[36,185],[284,185],[82,62],[238,62],[160,22],[120,40],[200,40]];
var LV = "";
[-72,-52,-32,-12,12,32,52,72].forEach(function(a, i){
  LV += '<path d="M0 0C-16-28-12-58 0-84C12-58 16-28 0 0Z" fill="' + (i % 2 ? "#7fc79a" : "#9adbb2") + '" stroke="none" transform="translate(160 262) rotate(' + a + ') scale(' + (1.05 + (i % 3) * .12) + ')"/>';
});
$("stems").insertAdjacentHTML("afterbegin", LV);
function sprig(p){
  var x = p[0], y = p[1], d = "";
  [[0,0,3],[-7,-6,2.6],[7,-5,2.8],[-4,-13,2.4],[5,-12,2.6],[0,-7,3]].forEach(function(o){
    d += '<circle cx="' + o[0] + '" cy="' + o[1] + '" r="' + o[2] + '" fill="#fff" stroke="rgba(0,0,0,.1)"/>';
  });
  $("stems").insertAdjacentHTML("beforeend", '<path class="stem" pathLength="1" stroke="#a8d8b8" stroke-width="1.5" d="M160 330Q' + ((160+x)/2) + ' ' + ((330+y)/2+20) + ' ' + x + ' ' + y + '"/><g transform="translate(' + x + ' ' + y + ')"><g class="bloom">' + d + '</g></g>');
}
var n = 0;
$("add").addEventListener("click", function(){
  var s = SLOTS[n]; sprig(SPR[n]); n++;
  $("stems").insertAdjacentHTML("beforeend", '<path class="stem" pathLength="1" d="M160 330Q' + ((160+s[0])/2) + ' ' + ((330+s[1])/2+30) + ' ' + s[0] + ' ' + (s[1]+10) + '"/>');
  $("flws").insertAdjacentHTML("beforeend", '<g transform="translate(' + s[0] + ' ' + s[1] + ') scale(' + s[4] + ')"><g class="bloom">' + flower(s[2], s[3]) + '</g></g>');
  $("add").textContent = "Plant a flower 🌷 (" + n + "/9)"; hearts(3);
  if (n === 9){
    $("add").style.display = "none"; $("sec").style.display = "inline-block";
    $("cap").textContent = "Nine flowers for you, " + CALL + " 🌼 (lots of daisies, your favorite)"; hearts(30);
  }
});
$("sec").addEventListener("click", function(){
  $("sec").style.display = "none";
  var pic = BICEP_PHOTO ? '<img src="' + BICEP_PHOTO + '" alt="Kirby flexing">' : '<span class="m">💪</span>';
  $("pop").innerHTML = pic + "<p>PA HEADLOCK KA BAE? HAHAHAHHAHAHAHHA</p>";
  var im = $("pop").querySelector("img"); if (im) im.onerror = function(){ im.outerHTML = '<span class="m">💪</span>'; };
  $("pop").classList.add("on"); hearts(45);
  setTimeout(function(){ $("pop").scrollIntoView({behavior:"smooth", block:"center"}); }, 300);
});
hearts(8);
</script>
</body>
</html>
